<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>HTML5</title>
    <script>
        // 페이지가 로드될 때 실행될 함수
        function loadPopUp() {
            // width=200, height=80 크기의 새 창 열기
            let win = window.open("", "", "width=200,height=80");
            
            // 새 창의 문서에 글자 작성
            win.document.write("접속 감사합니다!");
        }
    </script>
</head>
<!-- body 태그에 onload 리스너 등록 -->
<body onload="loadPopUp()">
    <h3>HTML5</h3>
    <hr>
    <p>
        HTML5를 학습하는 사이트입니다.<br>
        여기서 HTML5, CSS3, 자바스크립트를<br>
        배울 수 있습니다.
    </p>
</body>
</html>
