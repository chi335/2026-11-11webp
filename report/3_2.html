<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>사이트 접속 (2)</title>
    <script>
        function loadSite(select) {
            let url = select.value;
            if (url !== "") {
                // 창 이름(Target)을 "myWin"으로 지정하면, 이미 열려있는 동일한 이름의 창에서 주소만 바뀝니다.
                window.open(url, "myWin");
            }
        }
    </script>
</head>
<body>
    <h3>옵션 선택으로 사이트 접속</h3>
    <p>옵션 선택 시 이 윈도우를 공유하도록 웹 페이지를 작성하라.</p>
    <hr>
    접속할 사이트<br><br>
    <select onchange="loadSite(this)">
        <option value="https://www.naver.com">네이버</option>
        <option value="https://www.google.com">구글</option>
        <option value="https://www.oracle.com">오라클</option>
    </select>
</body>
</html>
