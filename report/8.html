<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>산수를 풀어 봅시다</title>
    <style>
        td { padding: 4px 10px; }
        input { width: 80px; }
    </style>
    <script>
        let time = 10;
        let timerId = null;

        // 10초 타이머를 시작하는 함수
        function startTimer() {
            // 이미 실행 중인 타이머가 있다면 초기화
            if (timerId !== null) {
                clearInterval(timerId);
            }
            
            time = 10;
            document.getElementById("timer").innerText = time;

            // 1초(1000ms) 간격으로 카운트다운
            timerId = setInterval(function() {
                time--;
                document.getElementById("timer").innerText = time;

                // 0초가 되면 타이머를 멈추고 자동 채점 실행
                if (time <= 0) {
                    clearInterval(timerId);
                    timerId = null;
                    calc(); // 자동 채점
                }
            }, 1000);
        }

        // 새로운 문제를 만드는 함수
        function makeQuestion() {
            let questions = document.getElementsByClassName("question");
            let answers = document.getElementsByClassName("answer");
            let ops = ["+", "-", "*", "/"];

            for (let i = 0; i < questions.length; i++) {
                let num1 = Math.floor(Math.random() * 20) + 1;
                let num2 = Math.floor(Math.random() * 20) + 1;
                let op = ops[Math.floor(Math.random() * ops.length)];

                questions[i].innerText = num1 + op + num2;
                questions[i].style.textDecoration = "none";
                answers[i].value = "";
            }

            document.getElementById("score").innerText = "0";
            
            // 문제 생성 시 타이머 다시 시작
            startTimer();
        }

        // 채점 함수
        function calc() {
            let questions = document.getElementsByClassName("question");
            let answers = document.getElementsByClassName("answer");
            let count = 0;

            for (let i = 0; i < questions.length; i++) {
                let qText = questions[i].innerText;
                let userAns = parseInt(answers[i].value);
                let correctAns = Math.floor(eval(qText));

                if (userAns === correctAns) {
                    count++;
                    questions[i].style.textDecoration = "none";
                } else {
                    questions[i].style.textDecoration = "line-through";
                }
            }

            document.getElementById("score").innerText = count;
        }
    </script>
</head>
<body onload="makeQuestion()">
    <h3>산수 문제를 풀어 봅시다.</h3>
    <p>
        문제는 자동으로 생성되며, 10초가 지나면 자동 채점됩니다.<br>
        남은 시간 <span id="timer">10</span>
    </p>
    <hr>
    <table>
        <tr><td><span class="question"></span></td><td><input type="text" class="answer"></td></tr>
        <tr><td><span class="question"></span></td><td><input type="text" class="answer"></td></tr>
        <tr><td><span class="question"></span></td><td><input type="text" class="answer"></td></tr>
        <tr><td><span class="question"></span></td><td><input type="text" class="answer"></td></tr>
        <tr>
            <td><button onclick="makeQuestion()">다시</button></td>
            <td><span id="score">0</span></td>
        </tr>
    </table>
</body>
</html>
