<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>스크린 장치에 관한 정보 출력</title>
<script>
function printScreen() {
    let text = "<span style='color:blue;'>availHeight:</span> " + screen.availHeight + "<br>";
    text += "<span style='color:blue;'>availWidth:</span> " + screen.availWidth + "<br>";
    text += "<span style='color:blue;'>colorDepth:</span> " + screen.colorDepth + "<br>";
    text += "<span style='color:blue;'>pixelDepth:</span> " + screen.pixelDepth + "<br>";
    text += "<span style='color:blue;'>height:</span> " + screen.height + "<br>";
    text += "<span style='color:blue;'>width:</span> " + screen.width + "<br>";
    
    document.getElementById("div").innerHTML = text;
}
</script>
</head>
<body onload="printScreen()">
<h3>스크린 장치에 관한 정보</h3>
<hr>
<div id="div"></div>
</body>
</html>
